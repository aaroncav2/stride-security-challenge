function diagramSVG(m){
 const W=1040,H=500,byId=Object.fromEntries(m.nodes.map(n=>[n[0],n]));
 const nodeW=170,nodeH=63;
 const zones=m.zones.map(z=>`<g><rect class="zone" x="${z[1]}" y="${z[2]}" width="${z[3]}" height="${z[4]}" rx="14"/><text class="zone-label" x="${z[1]+15}" y="${z[2]+24}">${escapeHTML(z[0])}</text></g>`).join('');
 const edges=m.edges.map(([aId,bId,label])=>{
  const a=byId[aId],b=byId[bId];if(!a||!b)return '';
  const ax=a[3]+nodeW/2,ay=a[4]+nodeH/2,bx=b[3]+nodeW/2,by=b[4]+nodeH/2;
  const dx=bx-ax,dy=by-ay,scale=Math.min(nodeW/2/Math.max(Math.abs(dx),1),nodeH/2/Math.max(Math.abs(dy),1));
  const sx=ax+dx*scale,sy=ay+dy*scale,ex=bx-dx*scale,ey=by-dy*scale;
  const mx=(sx+ex)/2,my=(sy+ey)/2,tw=Math.min(142,Math.max(52,label.length*7.1+15));
  return `<g><title>${escapeHTML(a[1]+' → '+b[1]+' · '+label)}</title><path class="connection" d="M${sx.toFixed(1)} ${sy.toFixed(1)} L${ex.toFixed(1)} ${ey.toFixed(1)}" marker-end="url(#arr)"/></g>`;
 }).join('');
 const nodes=m.nodes.map(n=>{
  const [id,label,type,x,y]=n;
  const words=label.split(' '),lines=[''];
  for(const word of words){let last=lines.length-1;if((lines[last]+' '+word).trim().length>18&&lines.length<2){lines.push(word);}else{lines[last]=(lines[last]+' '+word).trim();}}
  if(lines.length===1)lines[0]=label;
  const types={client:'CLIENT / SITE',service:'SERVICE / ROUTER',security:'SECURITY CONTROL',data:'DATA / REGISTRY',external:'EXTERNAL'};
  return `<g><rect class="node ${type}" x="${x}" y="${y}" width="${nodeW}" height="${nodeH}" rx="11"/><rect x="${x+10}" y="${y+11}" width="5" height="41" rx="2" fill="${type==='security'?'#56ad8d':type==='data'?'#ac88dd':type==='external'?'#e0a550':type==='client'?'#76aadd':'#9fb5cc'}"/><text class="node-type" x="${x+24}" y="${y+20}">${types[type]}</text>${lines.map((t,i)=>`<text class="node-label" x="${x+23}" y="${y+(lines.length===2?39:45)+i*15}">${escapeHTML(t)}</text>`).join('')}</g>`;
 }).join('');
 return `<svg class="diagram" viewBox="0 0 ${W} ${H}" role="img" aria-label="Read-only ${escapeAttr(m.name)} architecture: ${escapeAttr(m.description)}"><defs><marker id="arr" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 1 L9 5 L0 9" fill="none" stroke="#8099b7" stroke-width="1.7"/></marker></defs>${zones}${edges}${nodes}</svg>`;
}

 const g=activeGame();if(!g){tell('Start a game to export an assessment log.');return;}
 const rows=[['Game type','Trick','Player','Card','Decision','Threat','Component','Why / assessment','Recommended action','Threat points']];
 g.events.forEach(e=>rows.push([mode(g.modeId).name,e.trickNum,g.players.find(p=>p.id===e.playerId)?.name,formatSuit(BY_ID[e.cardId]),e.applicable?'Actionable':'Not actionable',e.applicable?e.title:'',e.component,e.reason,e.mitigation,e.applicable?1:0]));
 const q=x=>'"'+String(x??'').replace(/"/g,'""')+'"';
 download('STRIDE_Security_Challenge_'+g.modeId+'_assessments.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\r\n'),'text/csv;charset=utf-8');
}
function exportJSON(){const g=activeGame();if(!g)return;download('STRIDE_Security_Challenge_'+g.modeId+'_game.json',JSON.stringify(state,null,2),'application/json');}
function onClick(event){
 const el=event.target.closest('[data-action]');if(!el)return;
 const a=el.dataset.action;
 if(a==='backdrop'&&event.target!==el)return;
 if(a==='navigate'){changeView(el.dataset.view);return;}
 if(a==='select-mode'){cancelAI();ui.modalCard=null;state.modeId=el.dataset.mode;state.view='select';render();return;}
 if(a==='start'){beginGame(state.modeId);window.scrollTo(0,0);return;}
 if(a==='restart'){beginGame(activeGame()?.modeId||state.modeId);window.scrollTo(0,0);return;}
 if(a==='continue'){nextTrick();return;}
 if(a==='hand-filter'){ui.handFilter=el.dataset.filter;render();return;}
 if(a==='log-filter'){ui.logFilter=el.dataset.filter;render();return;}
 if(a==='card'){
  const id=el.dataset.card,p=currentPlayer();
  if(p?.id==='p0'&&legalCards().includes(id)){cancelAI();ui.modalCard=id;render();}
  return;
 }
 if(a==='close-modal'||a==='backdrop'){ui.modalCard=null;render();return;}
 if(a==='play-card'){
  const id=el.dataset.card;
  if(ui.modalCard===id){commitCard(id);}return;
 }
 if(a==='csv')exportCSV();
 if(a==='json')exportJSON();
}
document.addEventListener('click',onClick);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modalCard){ui.modalCard=null;render();}});
// Sanity-check the hard-coded threat model before exposing a partially working interface.
if(CARDS.length!==74||MODES.length!==3||CARDS.some(c=>!window.SC_NO_REASONS[c.id])||!MODES.every(m=>window.SC_GAPS[m.id])){
 root.textContent='The complete 74-card threat model could not be loaded. Please open the full downloaded game.';
}else render();
// Limited instrumentation for the deterministic local browser test suite; no network use.
if(window.SC_TEST_MODE)window.SC_TEST_HOOKS={getState:()=>structuredClone(state),assess:(m,c)=>window.SC_ASSESS(m,c),restart:()=>beginGame(state.game?.modeId||state.modeId),advance:nextTrick,step:()=>commitCard(legalCards()[0]),legal:()=>legalCards()};
})();
